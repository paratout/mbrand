services:
  angular-app:
    image: node:20
    container_name: mb-website-angular
    working_dir: /app
    volumes:
      - .:/app
      - firebase-config:/root/.config
    ports:
      - "4200:4200"
    command: >
      sh -c "npm install && npm run start -- --host 0.0.0.0 --poll 2000"
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  firebase-config:
