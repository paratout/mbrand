<div class="manager-container">
    <div class="manager-header">
        <h1 class="page-title">Insights & Articles</h1>
        <button class="btn-primary" (click)="toggleCompose()">
            {{ isComposing ? 'Cancel Publishing' : '+ New Article' }}
        </button>
    </div>

    <div class="compose-area glass" *ngIf="isComposing">
        <h2 class="section-title">Compose Article</h2>
        <form (submit)="publishArticle($event)" class="article-form">
            <div class="form-row">
                <div class="form-group flex-2">
                    <label>Title</label>
                    <input type="text" [(ngModel)]="newArticle.title" name="title" class="form-control" required
                        placeholder="Article Title...">
                </div>
                <div class="form-group flex-1">
                    <label>Category</label>
                    <input type="text" [(ngModel)]="newArticle.category" name="category" class="form-control" required
                        placeholder="e.g. Technology, Business">
                </div>
            </div>

            <div class="form-group">
                <label>Excerpt (Short summary for the index page)</label>
                <textarea [(ngModel)]="newArticle.excerpt" name="excerpt" class="form-control" rows="2" required
                    placeholder="A brief 1-2 sentence summary..."></textarea>
            </div>

            <div class="form-group">
                <label>Full Content (Markdown Supported)</label>
                <textarea [(ngModel)]="newArticle.content" name="content" class="form-control content-editor" rows="12"
                    required placeholder="Write your full article here..."></textarea>
            </div>

            <div class="form-actions">
                <span class="status-text success" *ngIf="saveSuccess">Article published successfully!</span>
                <span class="status-text error" *ngIf="saveError">{{ saveError }}</span>

                <button type="button" class="btn-outline" (click)="toggleCompose()">Cancel</button>
                <button type="submit" class="btn-primary" [disabled]="isSaving">
                    {{ isSaving ? 'Publishing...' : 'Publish Article' }}
                </button>
            </div>
        </form>
    </div>

    <div class="articles-list" *ngIf="!isComposing">
        <div class="empty-state" *ngIf="articles.length === 0 && !isLoading">
            No articles found. Click "New Article" to publish your first insight.
        </div>

        <div class="loading-state" *ngIf="isLoading">
            Loading articles...
        </div>

        <div class="article-card glass" *ngFor="let article of articles">
            <div class="card-header">
                <span class="category-badge">{{ article.category }}</span>
                <span class="date">{{ article.createdAt?.toDate() | date:'mediumDate' }}</span>
            </div>
            <h3 class="card-title">{{ article.title }}</h3>
            <p class="card-excerpt">{{ article.excerpt }}</p>

            <div class="card-actions">
                <button class="btn-danger" (click)="deleteArticle(article.id)">Delete</button>
            </div>
        </div>
    </div>
</div>
