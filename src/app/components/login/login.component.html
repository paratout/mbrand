<div class="login-wrapper">
    <div class="login-card glass">
        <div class="login-header">
            <h2 class="title">Admin Portal</h2>
            <p class="subtitle">Secure access for Mehdi Bamou.</p>
        </div>

        <form class="login-form" (submit)="login($event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" class="form-control"
                    placeholder="admin@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password" class="form-control"
                    placeholder="••••••••" required>
            </div>

            <div *ngIf="error" class="error-message">
                {{ error }}
            </div>

            <button type="submit" class="btn-primary w-100" [disabled]="loading">
                {{ loading ? 'Authenticating...' : 'Sign In' }}
            </button>

            <a routerLink="/" class="back-link">&larr; Back to Website</a>
        </form>
    </div>
</div>
