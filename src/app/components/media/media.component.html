<section class="media section-padding" id="media">
    <div class="container">
        <div class="section-header text-center">
            <div class="section-label center-label">Press & Media</div>
            <h2 class="section-title">Selected Appearances.</h2>
            <p class="section-subtitle">Keynotes, interviews, and public discussions.</p>
        </div>

        <div class="media-grid" *ngIf="!isLoading">
            <div *ngIf="mediaItems.length === 0"
                style="color: var(--text-secondary); padding: 2rem 0; text-align: center; width: 100%; grid-column: 1 / -1;">
                Media appearances will be published here soon.
            </div>

            <a [href]="item.videoUrl" target="_blank" class="media-card" *ngFor="let item of mediaItems">
                <div class="video-thumbnail">
                    <div class="play-button">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </div>
                    <div class="image-overlay"></div>
                </div>
                <div class="media-content">
                    <span class="media-tag">{{ item.tag }}</span>
                    <h3 class="media-title">{{ item.title }}</h3>
                    <p class="media-meta">{{ item.publisher }} • {{ item.duration }}</p>
                </div>
            </a>
        </div>

        <div *ngIf="isLoading" style="text-align: center; padding: 4rem 0; color: var(--text-secondary);">
            Loading media...
        </div>

        <div class="view-all text-center">
            <a href="#" class="btn-outline">View All Media</a>
        </div>
    </div>
</section>
